name: Build & Sign Custom Material You Icon Pack

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL for base Pix Material You APK'
        required: false
        default: ''
      create_release:
        description: 'Publish as a GitHub Release (v6.1.6)'
        type: boolean
        default: true
      release_tag:
        description: 'Semantic version tag (must strictly match v<Version>)'
        required: false
        default: 'v6.1.6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sign:
    name: Patch, Zipalign & Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Build Tools (zipalign & apksigner)
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner

      - name: Acquire Base APK
        id: acquire-apk
        run: |
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "Downloading base APK from input URL..."
            curl -fL "${{ inputs.apk_url }}" -o base.apk
          elif [ -f "base.apk" ]; then
            echo "Using base.apk from repository root."
          else
            # Check if there is an existing release asset or fail gracefully
            echo "Searching for APK in release or environment..."
            if command -v gh &> /dev/null; then
              gh release download "${{ inputs.release_tag }}" -p "*.apk" -O base.apk || true
            fi
            if [ ! -f "base.apk" ]; then
              echo "::error title=Missing Base APK::Please provide a direct apk_url in the workflow inputs or attach base.apk."
              exit 1
            fi
          fi
          echo "Base APK size: $(stat -c%s base.apk) bytes"

      - name: Run Surgical APK Patching Script
        run: |
          python3 tools/iconpack-mod/patch_apk.py base.apk unaligned.apk tools/iconpack-mod/custom_icons

      - name: Zipalign 4-byte Page Alignment
        run: |
          zipalign -p -f -v 4 unaligned.apk aligned.apk

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.jks \
            -alias iconpack_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=PixMaterialYouMod, OU=AndroidMod, O=Junkside, L=World, ST=Global, C=US"

      - name: Sign APK (v1, v2, and v3 schemes)
        run: |
          apksigner sign --ks release.jks \
            --ks-key-alias iconpack_key \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "Pix-Material-You-${{ inputs.release_tag }}-Modded.apk" \
            aligned.apk

      - name: Cryptographic Verification
        run: |
          apksigner verify --verbose --print-certs "Pix-Material-You-${{ inputs.release_tag }}-Modded.apk"

      - name: Upload Modded APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Pix-Material-You-${{ inputs.release_tag }}-Modded"
          path: "Pix-Material-You-${{ inputs.release_tag }}-Modded.apk"
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: "Pix-Material-You-${{ inputs.release_tag }}-Modded.apk"
          name: "${{ inputs.release_tag }}"
          tag_name: "${{ inputs.release_tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
