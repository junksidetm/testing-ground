name: Build & Sign Custom Material You Icon Pack

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL for base Pix Material You APK (leave empty to use default release base.apk)'
        required: false
        default: ''
      create_release:
        description: 'Publish/Attach to GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Semantic version tag (must strictly match v<Version>)'
        required: false
        default: 'v6.1.6'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sign:
    name: Rebuild Resources & Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Build Tools & Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner
          echo "Installing Apktool 2.10.0..."
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      - name: Acquire Base APK
        id: acquire-apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.apk_url }}" ]; then
            echo "Downloading base APK from input URL..."
            curl -fL "${{ inputs.apk_url }}" -o base.apk
          elif [ -f "base.apk" ]; then
            echo "Using base.apk from repository root."
          else
            echo "Downloading APK asset from release ${{ inputs.release_tag }}..."
            gh release download "${{ inputs.release_tag }}" --pattern "*.apk" --dir base_download/
            FOUND_APK=$(find base_download/ -type f -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              mv "$FOUND_APK" base.apk
            fi
            
            if [ ! -f "base.apk" ] || [ ! -s "base.apk" ]; then
              echo "::error title=Missing Base APK::Could not acquire base.apk."
              exit 1
            fi
          fi
          echo "Base APK successfully acquired! Size: $(stat -c%s base.apk) bytes"

      - name: Rebuild Resource Table (resources.arsc) via Apktool & AAPT2
        run: |
          echo "Decompiling resources (skipping smali for speed)..."
          apktool d -s -f base.apk -o decompiled_apk

          echo "Injecting custom PNGs..."
          TARGET_MIPMAP="decompiled_apk/res/mipmap-xxxhdpi"
          if [ ! -d "$TARGET_MIPMAP" ]; then
            TARGET_MIPMAP="decompiled_apk/res/mipmap-xxxhdpi-v4"
          fi
          mkdir -p "$TARGET_MIPMAP"
          cp tools/iconpack-mod/custom_icons/res/mipmap-xxxhdpi-v4/*.png "$TARGET_MIPMAP/"

          echo "Injecting custom Adaptive Icon XMLs..."
          mkdir -p decompiled_apk/res/drawable-anydpi-v26
          cp tools/iconpack-mod/custom_icons/res/drawable-anydpi-v26/*.xml decompiled_apk/res/drawable-anydpi-v26/

          echo "Patching launcher mappings in assets/ and res/xml/..."
          python3 tools/iconpack-mod/patch_decompiled.py decompiled_apk tools/iconpack-mod/custom_icons

          echo "Sanitizing resources for AAPT2 linking..."
          python3 tools/iconpack-mod/sanitize_for_aapt2.py decompiled_apk

          echo "Rebuilding APK and regenerating resources.arsc with AAPT2..."
          apktool b --use-aapt2 decompiled_apk -o unaligned.apk

      - name: Zipalign 4-byte Page Alignment
        run: |
          zipalign -p -f -v 4 unaligned.apk aligned.apk

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore release.jks \
            -alias iconpack_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=PixMaterialYouMod, OU=AndroidMod, O=Junkside, L=World, ST=Global, C=US"

      - name: Sign APK (v1, v2, and v3 schemes)
        run: |
          apksigner sign --ks release.jks \
            --ks-key-alias iconpack_key \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "Pix-Material-You-${{ inputs.release_tag }}-Modded.apk" \
            aligned.apk

      - name: Cryptographic Verification
        run: |
          apksigner verify --verbose --print-certs "Pix-Material-You-${{ inputs.release_tag }}-Modded.apk"

      - name: Upload Modded APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Pix-Material-You-${{ inputs.release_tag }}-Modded"
          path: "Pix-Material-You-${{ inputs.release_tag }}-Modded.apk"
          if-no-files-found: error

      - name: Attach Sole APK to GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="Pix-Material-You-${{ inputs.release_tag }}-Modded.apk"
          
          # Delete any existing assets so the release has ONLY ONE APK
          echo "Purging old assets from release ${{ inputs.release_tag }} to keep strictly one output APK..."
          for asset in $(gh release view "${{ inputs.release_tag }}" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            echo "Removing prior asset: $asset"
            gh release delete-asset "${{ inputs.release_tag }}" "$asset" -y || true
          done

          echo "Uploading final verified APK: $APK_FILE"
          gh release upload "${{ inputs.release_tag }}" "$APK_FILE" --clobber
