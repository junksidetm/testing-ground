name: Universal Multi-App Release Builder

on:
  workflow_dispatch:
    inputs:
      updated_app:
        description: 'Which application was updated?'
        required: true
        type: choice
        options:
          - 'Paisa Unrestricted Mod'
          - 'LongShotPDF'
          - 'Pix Material You Icon Pack Mod'
          - 'Both / All Apps'
        default: 'Paisa Unrestricted Mod'
      release_tag:
        description: 'Target Semantic Version Tag (leave empty to auto-detect from updated app version)'
        required: false
        default: ''
      custom_notes:
        description: 'Custom notes / changelog describing what was updated'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-all:
    name: Build All Apps & Publish Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: false

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper Binaries
        run: gradle wrapper --gradle-version 8.10.2

      - name: Install Android Build Tools & Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner apktool

      - name: Detect Versions & Configure Release Title
        id: meta
        run: |
          # 1. Detect LongShotPDF version
          LONGSHOT_VER=$(grep 'versionName = ' LongShotPDF/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$LONGSHOT_VER" ]; then
            LONGSHOT_VER="1.1.0"
          fi
          echo "LONGSHOT_VER=$LONGSHOT_VER" >> $GITHUB_OUTPUT
          echo "LongShotPDF version: $LONGSHOT_VER"

          # 2. Detect Pix Material You version
          if [ -f "Pix Material You Icon Pack Mod/version.txt" ]; then
            ICONPACK_VER=$(tr -d '\r\n' < "Pix Material You Icon Pack Mod/version.txt")
          else
            ICONPACK_VER="6.1.7"
          fi
          echo "ICONPACK_VER=$ICONPACK_VER" >> $GITHUB_OUTPUT
          echo "Pix Material You version: $ICONPACK_VER"

          # 3. Detect Paisa Unrestricted version
          PAISA_VER=$(grep '^version: ' paisa-mod/pubspec.yaml | head -n 1 | sed -E 's/version: ([0-9.]+).*/\1/')
          if [ -z "$PAISA_VER" ]; then
            PAISA_VER="6.0.0"
          fi
          echo "PAISA_VER=$PAISA_VER" >> $GITHUB_OUTPUT
          echo "Paisa Unrestricted version: $PAISA_VER"

          # 4. Determine Tag & Title (Strict GEMINI.md Release Title Mandate: Title MUST EXACTLY match the tag)
          UPDATED_APP="${{ inputs.updated_app }}"
          CUSTOM_TAG="${{ inputs.release_tag }}"

          if [ -n "$CUSTOM_TAG" ]; then
            FINAL_TAG="$CUSTOM_TAG"
          elif [ "$UPDATED_APP" = "Pix Material You Icon Pack Mod" ]; then
            FINAL_TAG="v$ICONPACK_VER"
          elif [ "$UPDATED_APP" = "Paisa Unrestricted Mod" ]; then
            FINAL_TAG="v$PAISA_VER"
          else
            FINAL_TAG="v$LONGSHOT_VER"
          fi

          # Strict Mandate: Release Title MUST simply and solely be the tag string: v<Version>
          RELEASE_TITLE="$FINAL_TAG"

          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # BUILD APP 1: LongShotPDF
      # -------------------------------------------------------------------------
      - name: Build LongShotPDF Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_LONGSHOT_APK="LongShot-PDF-v${{ steps.meta.outputs.LONGSHOT_VER }}.apk"
          
          if [ "${{ inputs.updated_app }}" = "LongShotPDF" ] || [ "${{ inputs.updated_app }}" = "Both / All Apps" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
            BUILT_APK=$(find LongShotPDF/app/build/outputs/apk/release app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
            cp "$BUILT_APK" "$OUTPUT_LONGSHOT_APK"
          else
            echo "LongShotPDF was not updated. Attempting to download current stable release asset..."
            if gh release download --pattern "LongShot-PDF-*.apk" --output "$OUTPUT_LONGSHOT_APK"; then
              echo "Downloaded stable $OUTPUT_LONGSHOT_APK"
            else
              echo "Fallback: Compiling LongShotPDF from source..."
              chmod +x gradlew
              ./gradlew :app:assembleRelease --no-daemon --stacktrace
              BUILT_APK=$(find LongShotPDF/app/build/outputs/apk/release app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
              cp "$BUILT_APK" "$OUTPUT_LONGSHOT_APK"
            fi
          fi
          echo "LONGSHOT_APK=$OUTPUT_LONGSHOT_APK" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # BUILD APP 2: Pix Material You Icon Pack Mod
      # -------------------------------------------------------------------------
      - name: Build Pix Material You Icon Pack Mod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_ICON_APK="Pix-Material-You-v${{ steps.meta.outputs.ICONPACK_VER }}-Modded.apk"
          
          if [ "${{ inputs.updated_app }}" = "Pix Material You Icon Pack Mod" ] || [ "${{ inputs.updated_app }}" = "Both / All Apps" ]; then
            if [ -f "Pix Material You Icon Pack Mod/base.apk" ]; then
              cd "Pix Material You Icon Pack Mod"
              python3 patch_apk.py base.apk output_modded.apk
              cd ..
              
              zipalign -p -f -v 4 "Pix Material You Icon Pack Mod/output_modded.apk" iconpack_aligned.apk
              
              keytool -genkey -v -keystore iconpack_release.jks \
                -alias iconpack_key -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=PixMaterialYouMod, OU=TestingGround, O=Junkside, L=World, ST=Global, C=US"
                
              apksigner sign --ks iconpack_release.jks --ks-key-alias iconpack_key \
                --ks-pass pass:android --key-pass pass:android \
                --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
                --out "$OUTPUT_ICON_APK" iconpack_aligned.apk
            else
              gh release download --pattern "Pix-Material-You-*.apk" --output "$OUTPUT_ICON_APK" || true
            fi
          else
            echo "Pix Material You was not updated. Attempting to download current stable release asset..."
            gh release download --pattern "Pix-Material-You-*.apk" --output "$OUTPUT_ICON_APK" || true
          fi

          echo "ICONPACK_APK=$OUTPUT_ICON_APK" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # BUILD APP 3: Paisa Unrestricted Mod
      # -------------------------------------------------------------------------
      - name: Build Paisa Unrestricted Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT_PAISA_APK="Paisa-Unrestricted-v${{ steps.meta.outputs.PAISA_VER }}.apk"
          
          if [ -d "paisa-mod" ]; then
            echo "Building Paisa Unrestricted from paisa-mod/..."
            cd paisa-mod
            flutter pub get
            flutter build apk --release --no-tree-shake-icons
            cd ..
            
            BUILT_PAISA=$(find paisa-mod/build -name "*release*.apk" 2>/dev/null | head -n 1)
            if [ -n "$BUILT_PAISA" ] && [ -f "$BUILT_PAISA" ]; then
              cp "$BUILT_PAISA" "$OUTPUT_PAISA_APK"
              echo "Built and copied $OUTPUT_PAISA_APK"
            else
              echo "::warning title=Paisa Build Notice::Could not locate app-release.apk"
              gh release download --pattern "Paisa-Unrestricted-*.apk" --output "$OUTPUT_PAISA_APK" || true
            fi
          else
            echo "::warning title=paisa-mod Missing::paisa-mod directory not found"
            gh release download --pattern "Paisa-Unrestricted-*.apk" --output "$OUTPUT_PAISA_APK" || true
          fi

          echo "PAISA_APK=$OUTPUT_PAISA_APK" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------------
      # PUBLISH ALL APKS TO GITHUB RELEASE
      # -------------------------------------------------------------------------
      - name: Publish All Applications to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.FINAL_TAG }}"
          TITLE="${{ steps.meta.outputs.RELEASE_TITLE }}"
          UPDATED_APP="${{ inputs.updated_app }}"
          CUSTOM_NOTES="${{ inputs.custom_notes }}"
          LONGSHOT_APK="LongShot-PDF-v${{ steps.meta.outputs.LONGSHOT_VER }}.apk"
          ICONPACK_APK="Pix-Material-You-v${{ steps.meta.outputs.ICONPACK_VER }}-Modded.apk"
          PAISA_APK="Paisa-Unrestricted-v${{ steps.meta.outputs.PAISA_VER }}.apk"

          # Assemble release notes
          NOTES_FILE="release_notes.md"
          echo "## 🧪 Testing Ground Multi-App Release" > $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "### 🚀 What Was Updated" >> $NOTES_FILE
          if [ -n "$CUSTOM_NOTES" ]; then
            echo "$CUSTOM_NOTES" >> $NOTES_FILE
          else
            echo "* **Active Update:** **$UPDATED_APP**" >> $NOTES_FILE
          fi
          echo "" >> $NOTES_FILE
          echo "### 📦 Bundled Application Deliverables" >> $NOTES_FILE
          if [ -f "$LONGSHOT_APK" ]; then
            echo "* `$LONGSHOT_APK` — LongShotPDF (v${{ steps.meta.outputs.LONGSHOT_VER }})" >> $NOTES_FILE
          fi
          if [ -f "$ICONPACK_APK" ]; then
            echo "* `$ICONPACK_APK` — Pix Material You Icon Pack (v${{ steps.meta.outputs.ICONPACK_VER }})" >> $NOTES_FILE
          fi
          if [ -f "$PAISA_APK" ]; then
            echo "* `$PAISA_APK` — Paisa Unrestricted Mod (v${{ steps.meta.outputs.PAISA_VER }})" >> $NOTES_FILE
          fi
          echo "" >> $NOTES_FILE
          echo "> All hosted applications in Testing Ground are bundled with each release. Unchanged applications retain their current stable build." >> $NOTES_FILE

          # Upload or create release
          ASSETS_TO_UPLOAD=()
          if [ -f "$LONGSHOT_APK" ]; then ASSETS_TO_UPLOAD+=("$LONGSHOT_APK"); fi
          if [ -f "$ICONPACK_APK" ]; then ASSETS_TO_UPLOAD+=("$ICONPACK_APK"); fi
          if [ -f "$PAISA_APK" ]; then ASSETS_TO_UPLOAD+=("$PAISA_APK"); fi

          if gh release view "$TAG" &>/dev/null; then
            echo "Updating existing release $TAG..."
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            for asset in "${ASSETS_TO_UPLOAD[@]}"; do
              gh release upload "$TAG" "$asset" --clobber
            done
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${ASSETS_TO_UPLOAD[@]}" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi
